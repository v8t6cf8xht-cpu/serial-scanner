<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>序號掃描工具</title>
<script src="https://unpkg.com/html5-qrcode" defer></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;background:#f3f5f7;color:#222}
.wrap{max-width:650px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #00000012}
h1{font-size:24px;margin:4px 0 16px;text-align:center}
label{font-weight:bold;display:block;margin-bottom:7px}
input,button,select{font-size:18px;border-radius:10px;border:1px solid #ccc;padding:12px;width:100%}
input{margin-bottom:12px}
.mode{display:flex;gap:8px}.mode button{flex:1;background:#eee}.mode button.active{background:#222;color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button{border:0;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#64748b}.danger{background:#dc2626}.success{background:#16a34a}
#reader{width:100%;overflow:hidden;border-radius:12px;margin-top:12px}
.status{text-align:center;font-size:20px;font-weight:bold;margin:10px 0}
.count{font-size:32px;text-align:center;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.small{font-size:13px;color:#666}.hidden{display:none!important}
#manual{margin-top:10px}.row{display:flex;gap:8px}.row input{flex:1;margin:0}.row button{width:120px}
</style>
<style>
.camera-card{padding:0;overflow:hidden}
.camera-card #reader{order:1}
.camera-card .camera-head{order:0}
</style></head>
<body>
<div class="wrap">
  <div class="card">
    <h1>📷 序號掃描工具</h1>
    <label>② 掃描方式</label>
    <div class="mode">
      <button id="qrBtn" class="active" onclick="setMode('QR_CODE')">QR Code</button>
      <button id="barBtn" onclick="setMode('BARCODE')">二維/條碼</button>
    </div>
    <p class="small">先輸入型號，再開啟相機。掃描成功後會自動連續累積序號。</p>
  </div>

  <div class="card">
    <label for="model">型號</label>
    <input id="model" placeholder="例如：ABC-123" autocomplete="off">
    <div class="count"><span id="count">0</span></div>
    <div class="status" id="status">尚未開始</div>
    <div class="actions">
      <button class="success" onclick="startScan()">開啟相機掃描</button>
      <button class="secondary" onclick="stopScan()">停止相機</button>
    </div>
    <div id="reader" class="hidden"></div>
  </div>

  <div class="card">
    <label>③ 手動輸入序號</label>
    <div class="row">
      <input id="manual" placeholder="輸入序號">
      <button onclick="addManual()">加入</button>
    </div>
  </div>

  <div class="card">
    <label>已掃描清單</label>
    <div style="overflow:auto;max-height:420px">
      <table>
        <thead><tr><th>#</th><th>型號</th><th>序號</th><th>時間</th><th></th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
    <div class="actions">
      <button class="success" onclick="exportExcel()">匯出 Excel</button>
      <button class="danger" onclick="clearAll()">清除全部</button>
    </div>
  </div>
</div>

<script>
let mode='QR_CODE';
let scanner=null;
let running=false;
let records=[];
let lastText='';
let lastTime=0;

function setMode(m){
  mode=m;
  document.getElementById('qrBtn').classList.toggle('active',m==='QR_CODE');
  document.getElementById('barBtn').classList.toggle('active',m==='BARCODE');
  setStatus(m==='QR_CODE'?'QR Code 模式':'二維/條碼模式');
}

function setStatus(t){document.getElementById('status').textContent=t}

async function startScan(){
  const model=document.getElementById('model').value.trim();
  if(!model){alert('請先輸入型號');document.getElementById('model').focus();return}
  if(running)return;
  if(typeof Html5Qrcode==='undefined'){alert('掃描元件尚未載入，請確認網路後重新整理');return}
  document.getElementById('reader').classList.remove('hidden');
  scanner=new Html5Qrcode('reader');
  const formats = mode==='QR_CODE'
    ? [Html5QrcodeSupportedFormats.QR_CODE]
    : [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.ITF
      ];
  const config={fps:10,qrbox:{width:280,height:180},formatsToSupport:formats};
  try{
    await scanner.start({facingMode:'environment'},config,onScanSuccess,onScanError);
    running=true;setStatus('掃描中… 對準序號');
  }catch(e){
    setStatus('無法開啟相機');
    alert('無法開啟相機。請使用 HTTPS 網址，並允許瀏覽器使用相機。');
    document.getElementById('reader').classList.add('hidden');
  }
}

function onScanSuccess(text){
  const now=Date.now();
  if(text===lastText && now-lastTime<1800)return;
  lastText=text;lastTime=now;
  addRecord(text);
}

function onScanError(){}

async function stopScan(){
  if(scanner && running){
    try{await scanner.stop()}catch(e){}
    try{scanner.clear()}catch(e){}
  }
  running=false;scanner=null;
  document.getElementById('reader').classList.add('hidden');
  setStatus('已停止');
}

function addManual(){
  const el=document.getElementById('manual');
  const text=el.value.trim();
  if(!text)return;
  addRecord(text);
  el.value='';el.focus();
}

function addRecord(serial){
  const model=document.getElementById('model').value.trim();
  if(!model){alert('請先輸入型號');return}
  const duplicate=records.some(r=>r.serial===serial);
  if(duplicate){setStatus('⚠️ 重複序號：'+serial);return}
  records.push({model,serial,time:new Date()});
  render();
  setStatus('✓ 已加入：'+serial);
}

function removeRecord(i){records.splice(i,1);render()}

function render(){
  document.getElementById('count').textContent=records.length;
  const tbody=document.getElementById('list');
  tbody.innerHTML='';
  records.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${i+1}</td><td>${escapeHtml(r.model)}</td><td>${escapeHtml(r.serial)}</td><td>${formatTime(r.time)}</td><td><button class="danger" style="padding:6px;font-size:13px" onclick="removeRecord(${i})">刪除</button></td>`;
    tbody.appendChild(tr);
  });
}

function formatTime(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function exportExcel(){
  if(!records.length){alert('目前沒有資料可匯出');return}
  if(typeof ExcelJS==='undefined'){alert('Excel 元件尚未載入，請確認網路後重試');return}
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('序號');
  ws.columns=[
    {header:'型號',key:'model',width:24},
    {header:'序號',key:'serial',width:30},
    {header:'掃描時間',key:'time',width:22}
  ];
  records.forEach(r=>ws.addRow({model:r.model,serial:r.serial,time:formatTime(r.time)}));
  ws.getRow(1).font={bold:true};
  ws.views=[{state:'frozen',ySplit:1}];
  const buffer=await wb.xlsx.writeBuffer();
  const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`序號掃描_${new Date().toISOString().slice(0,10)}.xlsx`;
  a.click();URL.revokeObjectURL(a.href);
}

function clearAll(){
  if(!records.length)return;
  if(confirm('確定要清除全部掃描資料嗎？')){
    records=[];render();setStatus('已清除');
  }
}
document.getElementById('manual').addEventListener('keydown',e=>{if(e.key==='Enter')addManual()});
</script>
</body>
</html>
